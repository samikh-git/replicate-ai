[project]
name = "replicate-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.5.5",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-cloudflare>=0.3.4",
  "langchain-google-genai>=4.0.0",
  "langchain-groq>=0.3",
  "langchain-modal>=0.0.4",
  "modal>=1.4",
  "pymupdf4llm>=0.0.17",
  "pymupdf>=1.24",
  "camelot-py>=0.11",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "textual>=0.86",
]

[dependency-groups]
sandbox = [
  "pandas==2.2.*",
  "numpy==2.0.*",
  "statsmodels==0.14.*",
  "linearmodels==6.*",
  "pyfixest==0.25.*",
  "matplotlib==3.9.*",
]
dev = ["pytest", "ruff", "rdata"]

[project.scripts]
replicate-ai = "replicate_ai.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replicate_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/replicate_ai/system_prompts" = "replicate_ai/system_prompts"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
