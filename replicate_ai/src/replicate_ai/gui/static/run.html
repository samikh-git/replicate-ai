<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReplicateAI — Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="container wide">
      <header class="run-header">
        <h1>ReplicateAI</h1>
        <div class="run-meta" id="run-meta">Loading…</div>
        <div class="phases" id="phases"></div>
      </header>

      <div class="run-grid">
        <div class="pane">
          <div class="pane-title">Run log</div>
          <div class="log-body" id="log-body"></div>
        </div>
        <div class="pane">
          <div class="pane-title">Detail</div>
          <div class="detail-body" id="detail-body">
            <p style="color: var(--dim)">Waiting for target specification and estimates…</p>
          </div>
        </div>
      </div>

      <div class="running-head" id="running-head"></div>

      <div class="toolbar">
        <button type="button" class="secondary" id="btn-save">Save audit</button>
        <button type="button" class="secondary" id="btn-log">View full log</button>
        <button type="button" class="secondary" id="btn-home">Back to launcher</button>
      </div>
    </div>
    <script src="/run.js"></script>
  </body>
</html>
